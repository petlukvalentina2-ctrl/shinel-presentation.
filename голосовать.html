<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Голосование — Адал азамат</title><style>body{margin:0;background:#112447;color:#f7e8c3;font:18px Georgia,serif;display:grid;place-items:center;min-height:100vh}.card{max-width:560px;margin:18px;padding:28px;border:2px solid #c9a451;border-radius:20px;background:#23365b}h1{font-size:29px}button{display:block;width:100%;padding:16px;margin:12px 0;background:#f4db99;border:0;border-radius:12px;font:19px Georgia;cursor:pointer;color:#251b10}button:disabled{opacity:.5;cursor:default}#status{line-height:1.5;min-height:50px}small{opacity:.8}</style></head><body><main class="card"><h1>От знаний — к воспитанию личности</h1><p>Готовы ли вы превратить обычный урок в увлекательное приключение, которое воспитывает честного гражданина?</p><div id="options"><button data-v="0">Да, готов(а) создавать!</button><button data-v="1">Хочу попробовать!</button><button data-v="2">Хочу узнать больше!</button></div><p id="status">Подключаем голосование…</p><small>Один голос в этом браузере. При сбое страницу можно открыть повторно.</small></main><script type="module">import {db,doc,getDoc,setDoc,signIn} from './firebase-vote.js';const st=document.getElementById('status'),btns=[...document.querySelectorAll('[data-v]')];let uid=null,busy=false;function lock(){btns.forEach(b=>b.disabled=true)}async function check(){try{const u=await signIn();uid=u.uid;const d=await getDoc(doc(db,'votes',uid));if(d.exists()){lock();st.textContent='Ваш голос уже принят! Спасибо за участие.'}else st.textContent='Выберите один вариант ответа.'}catch(e){st.textContent='Не удалось подключиться ('+e.code+'). Проверьте интернет и обновите страницу.'}}btns.forEach(b=>b.onclick=async()=>{if(busy||!uid)return;busy=true;lock();st.textContent='Отправляем голос…';try{await setDoc(doc(db,'votes',uid),{choice:Number(b.dataset.v),createdAt:new Date().toISOString()});st.textContent='Ваш голос принят! Спасибо за участие.'}catch(e){if(e.code==='permission-denied'){st.textContent='Голос уже учтён либо доступ закрыт. Обновите страницу для проверки.'}else{st.textContent='Не удалось подтвердить отправку. Обновите страницу: система проверит, сохранился ли голос.'}}finally{busy=false}});check();</script></body></html>
