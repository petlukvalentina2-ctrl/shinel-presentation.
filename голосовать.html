<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Голосование — Адал азамат</title><style>body{font:18px Georgia,serif;background:#132a49;color:#f4e3c0;margin:0;min-height:100vh;display:grid;place-items:center}main{background:#f4e7c8;color:#362719;border:5px double #b68d4a;border-radius:16px;padding:28px;max-width:540px;margin:18px;text-align:center}h1{font-size:25px}button{display:block;width:100%;margin:12px 0;padding:16px;background:#65373a;color:#fff3d9;border:0;border-radius:12px;font:18px Georgia;cursor:pointer}button:disabled{opacity:.6}#msg{font-weight:bold}</style></head><body><main><h1>Адал азамат — воспитание личности</h1><p>Готовы ли вы превратить обычный урок в увлекательное приключение, которое воспитывает честного гражданина?</p><button data-v="0" disabled>Да, готов(а) создавать!</button><button data-v="1" disabled>Хочу попробовать!</button><button data-v="2" disabled>Хочу узнать больше!</button><p id="msg">Подключение…</p></main><script type="module">
import {firebaseConfig,pollId} from './настройки-голосования.js';
const msg=document.getElementById('msg'),buttons=[...document.querySelectorAll('button')];
if(!firebaseConfig.apiKey||!firebaseConfig.appId){msg.textContent='Голосование пока не настроено'}else try{
const [{initializeApp},{getAuth,signInAnonymously},{getFirestore,doc,getDoc,setDoc}]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js')]);
const app=initializeApp(firebaseConfig),auth=getAuth(app);await signInAnonymously(auth);const db=getFirestore(app),voteRef=doc(db,'votes',auth.currentUser.uid);const existing=await getDoc(voteRef);
if(existing.exists()){msg.textContent='Вы уже проголосовали с этого устройства.'}else{buttons.forEach(b=>{b.disabled=false;b.onclick=async()=>{buttons.forEach(x=>x.disabled=true);try{await setDoc(voteRef,{choice:Number(b.dataset.v)});msg.textContent='Спасибо! Ваш голос учтён.'}catch(e){msg.textContent='Не удалось отправить голос. Проверьте подключение.';buttons.forEach(x=>x.disabled=false)}}});msg.textContent='Выберите один ответ'}
}catch(e){msg.textContent='Ошибка подключения к голосованию';console.error(e)}
</script></body></html>
