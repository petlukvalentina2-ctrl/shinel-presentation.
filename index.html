 else{const g=t=='game',u=g?'Материалы/igra-shinel.html':'Материалы/generator.html';$('#mt').textContent=g?'🎮 Литературный HTML-квест «Шинель. Дело о потерянной человечности»':'✨ Авторский генератор промптов';
  b.innerHTML=`<iframe src="${u}" allow="clipboard-write; fullscreen" title="${g?'Игра':'Генератор'}"></iframe>`;a.innerHTML=`<a class="mb" href="${u}" target="_blank" rel="noopener">↗ В новой вкладке</a>`}
 ov.classList.add('on');$('#mx').focus()}

$('#pv').onclick=()=>show(cur-1);$('#nx').onclick=()=>show(cur+1);
document.addEventListener('keydown',e=>{if(e.key=='Escape'){closeM();return}if(open)return;if(['ArrowRight','PageDown',' '].includes(e.key)){show(cur+1);e.preventDefault()}if(['ArrowLeft','PageUp'].includes(e.key))show(cur-1);if(e.key=='Home')show(0);if(e.key=='End')show(S.length-1)});
